name: Publish NuGet Package

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Copy License to Project Directory
        run: cp LICENSE ./src/DSC.Tech.Hypatia/

      - name: Pack
        run: dotnet pack ./src/DSC.Tech.Hypatia/DSC.Tech.Hypatia.csproj -c Release --no-build -o ./nupkg

      - name: Show generated packages
        run: ls -lah ./nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: diegoschagas

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate