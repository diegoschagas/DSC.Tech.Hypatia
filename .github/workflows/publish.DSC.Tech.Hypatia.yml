name: Publish NuGet Package

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  pack:
    name: Pack NuGet Package
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Copy License to Source Directory
        run: cp LICENSE ./src/

      - name: Pack Project
        run: dotnet pack ./src/DSC.Tech.Hypatia/DSC.Tech.Hypatia.csproj -c Release -o ./nupkg

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

  publish:
    name: Publish to NuGet
    needs: pack
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      - name: Show generated packages
        run: ls -lah ./nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: diegoschagas

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate