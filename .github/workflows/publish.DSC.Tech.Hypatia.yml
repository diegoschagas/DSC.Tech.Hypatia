name: Quality Gate and Publish

# Quality Gate em todo push na master e em todo pull request (ADR-002).
# Publicação no NuGet somente em tags de versão (v*).
on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Build Release com warnings como erros, testes com cobertura (mínimo de 90% das linhas),
      # pack de teste, consumidor externo e varredura de MediatR/LuckyPenny.
      - name: Run Quality Gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1

      - name: Upload Quality Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-evidence
          path: docs/evidencias/

  pack:
    name: Pack NuGet Package
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Copy License to Source Directory
        run: cp LICENSE ./src/

      - name: Pack Project
        run: dotnet pack ./src/DSC.Tech.Hypatia/DSC.Tech.Hypatia.csproj -c Release -o ./nupkg

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

  publish:
    name: Publish to NuGet
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      - name: Show generated packages
        run: ls -lah ./nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: diegoschagas

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
